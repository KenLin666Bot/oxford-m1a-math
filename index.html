<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Oxford M1A 学习站" />
  <title>Oxford Mathematics for the New Century (M1A) · 全知识点交互精讲站</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23162d59'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='22' fill='%23f59e0b'%3EM1A%3C/text%3E%3C/svg%3E" />

  <!-- Local Bundled KaTeX (Offline & GitHub Pages Reliable) -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />

  <!-- Modular Site Styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="top-header">
    <div class="brand-area">
      <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="打开章节目录">☰ 目录</button>
      <div class="brand-logo" aria-hidden="true">M1A</div>
      <div>
        <div class="brand-title">Oxford New Century M1A · 微积分与代数全景站</div>
        <div class="brand-sub">Module 1: Calculus and Statistics · 中文通俗精讲 × 英文术语与课本标准公式</div>
      </div>
    </div>

    <nav class="nav-tabs" aria-label="学习模式导航">
      <button type="button" class="nav-tab active" data-top-view="learn">📖 章节精讲与闯关</button>
      <button type="button" class="nav-tab" data-top-view="map">🕸️ 知识关系图谱</button>
      <button type="button" class="nav-tab" data-top-view="labs">🔬 微积分实验室</button>
      <button type="button" class="nav-tab" data-top-view="formulas">📐 公式与术语词典</button>
      <button type="button" class="nav-tab" data-top-view="notebook">⭐ 我的复习本</button>
    </nav>

    <div class="header-tools">
      <span id="global-progress-pill" class="progress-pill">学习进度：0/26 讲 (0%)</span>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div id="app-shell" class="app-shell">
    <aside id="app-sidebar" class="sidebar" aria-label="课本章节目录"></aside>
    <main id="app-main" class="main-panel"></main>
  </div>

  <!-- KaTeX Runtime -->
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/contrib/auto-render.min.js"></script>

  <!-- Modular Curriculum Data -->
  <script defer src="js/data/curriculum-map.js"></script>
  <script defer src="js/data/ch1-binomial.js"></script>
  <script defer src="js/data/ch2-exp-log.js"></script>
  <script defer src="js/data/ch3-limits-deriv.js"></script>
  <script defer src="js/data/ch4-diff-rules.js"></script>
  <script defer src="js/data/ch5-diff-apps.js"></script>
  <script defer src="js/data/ch6-indef-int.js"></script>
  <script defer src="js/data/ch7-def-int.js"></script>

  <!-- Interactive Visualizations, Knowledge Graph, Quiz Stepper & App Entry -->
  <script defer src="js/labs/calculus-labs.js"></script>
  <script defer src="js/components/concept-graph.js"></script>
  <script defer src="js/components/quiz-stepper.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
